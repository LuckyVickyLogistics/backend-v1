spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ai
              uri: lb://AI
              predicates:
                - Path=/api/v1/ai-prompts/**
            - id: company
              uri: lb://COMPANY
              predicates:
                - Path=/api/v1/companies/**
            - id: delivery
              uri: lb://DELIVERY
              predicates:
                - Path=/api/v1/deliveries/**, /api/v1/delivery-managers/**, /api/v1/delivery-routes/**
            - id: hub
              uri: lb://HUB
              predicates:
                - Path=/api/v1/hubs/**
            - id: order
              uri: lb://ORDER
              predicates:
                - Path=/api/v1/orders/**
            - id: product
              uri: lb://PRODUCT
              predicates:
                - Path=/api/v1/products/**
            - id: slack
              uri: lb://SLACK
              predicates:
                - Path=/api/v1/slack-messages/**
            - id: user
              uri: lb://USER
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 19090

jwt:
  secret: ${JWT_SECRET}